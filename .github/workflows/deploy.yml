name: Deploy to Pages

on:
  push:
    branches: [main]
    # The weekly backup commits a copy of the league's data and nothing the site
    # renders, so rebuilding and republishing for it would spend a deploy to
    # produce a byte-identical site.
    paths-ignore:
      - 'backups/**'
  workflow_dispatch:

# Read the repository, publish to Pages, and mint the token the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site is not published unless all four validations pass.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run

      # The site reads the season from Supabase when these two are set and from
      # the versioned seed when they are not, so a build with no variables is a
      # working site rather than a broken one. Both are repository variables and
      # not secrets: the project URL and the publishable key ship inside the
      # bundle by design, and security rests on row level security.
      #
      # They are written to a file instead of being passed as `env:`, and the step
      # is skipped when they are empty, because Vite lets a variable already in
      # the environment win over the one in an env file. Passing them
      # unconditionally set both to the empty string whenever the repository
      # variables were unset, which silently overrode a committed
      # `.env.production` and left the deployed site on the seed no matter what
      # the file said. `.env.production.local` outranks `.env.production`, so the
      # repository variables still win when they exist, and `.env.*.local` is
      # ignored by git, so nothing is left behind in a commit.
      # The two values reach the shell as environment variables rather than as
      # `${{ }}` inside the script, so a value carrying a quote or a `$(` is
      # written as text instead of being run.
      - name: Point the build at Supabase
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != ''
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          {
            printf 'VITE_SUPABASE_URL=%s\n' "$URL"
            printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$KEY"
          } > .env.production.local

      - run: npm run build

      # The one class of bug this repository cannot catch on its own: a select the
      # library and the type checker both accept and the service refuses. It cost
      # a published site with no fixture and no standings once. Runs only when the
      # variables are set, and passes when the project is merely asleep.
      - name: Check the site's queries against the real service
        if: vars.SUPABASE_URL != '' && vars.SUPABASE_PUBLISHABLE_KEY != ''
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: npm run smoke:queries

      # The Pages site is created once by hand, by an administrator of the
      # repository, with "GitHub Actions" as the source. The workflow token
      # cannot create it: the API answers "not accessible by integration".
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
