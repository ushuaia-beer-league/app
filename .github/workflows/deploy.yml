name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read the repository, publish to Pages, and mint the token the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway through publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The site is not published unless all four validations pass.
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build

      # `enablement` creates the Pages site on the first run, so publishing does
      # not depend on anyone holding admin rights on the repository.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
