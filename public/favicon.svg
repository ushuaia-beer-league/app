<!--
  Provisional mark: a puck on the ice, in the league's own night and gold.

  The league's crest is a JPEG on a light background that the reference site
  forces white with a CSS filter, so there is no asset that can become a 16px
  icon. This stands in until a transparent crest arrives, and it is a shape
  rather than lettering because three letters are unreadable at that size.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Ushuaia Beer League">
  <rect width="32" height="32" rx="6" fill="#0a0e14" />
  <ellipse cx="16" cy="21" rx="10" ry="3.4" fill="#7ab8d4" opacity="0.35" />
  <ellipse cx="16" cy="15" rx="9" ry="4.2" fill="#e8a820" />
  <ellipse cx="16" cy="13.4" rx="9" ry="4.2" fill="#f0b830" />
</svg>
