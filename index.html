<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ushuaia Beer League</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Liga recreativa de hockey sobre hielo de Ushuaia, Tierra del Fuego."
    />

    <!--
      The one address that counts, said out loud, because this site exists at more
      than one. The test copy on Vercel is byte for byte the same document, and
      without this a search engine has two candidates for the same page and may
      pick the branch. On the test build it points here too, which is exactly
      right: it says "the real one is over there".
    -->
    <link rel="canonical" href="https://ushuaia-beer-league.github.io/app/" />

    <!--
      The card that shows when somebody drops the link into a WhatsApp group,
      which is how this site will actually be shared.

      The image is the league's crest, and it is absolute because a relative one
      is ignored by every scraper. It is served from `public/` rather than
      imported like the crest the page itself draws: an imported asset gets a
      hash in its filename at build time, and a hash cannot be written into
      static HTML.

      It is the drawing's own portrait shape rather than the 1200 by 630 that a
      wide card wants. That is why the card is declared as `summary`: a square-ish
      image in a square-ish card, instead of the league's crest cropped to fit a
      shape nobody drew it for.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ushuaia Beer League" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:title" content="Ushuaia Beer League" />
    <meta
      property="og:description"
      content="Fixture, posiciones, goleadores y playoffs de la liga recreativa de hockey sobre hielo de Ushuaia."
    />
    <meta
      property="og:url"
      content="https://ushuaia-beer-league.github.io/app/"
    />
    <meta
      property="og:image"
      content="https://ushuaia-beer-league.github.io/app/ubl-crest.webp"
    />
    <meta property="og:image:width" content="700" />
    <meta property="og:image:height" content="839" />
    <meta
      property="og:image:alt"
      content="Escudo de la Ushuaia Beer League: un chopp de cerveza con patines de hockey."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="theme-color" content="#0a0e14" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
