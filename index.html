<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ushuaia Beer League</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Raster icons for the crawlers and browsers that want one. favicon.ico
         exists even unlinked: crawlers ask for the path by convention, and an
         absent file here falls into the SPA rewrite and answers HTML with a
         200 — which is exactly what Google's favicon fetcher got, and why the
         search results wore a generic globe instead of the league's mark. -->
    <link rel="icon" href="/favicon-48.png" type="image/png" sizes="48x48" />
    <link rel="icon" href="/favicon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      The claim is the league's own and it is deliberately narrow. "The most
      southern ice hockey league in the world" is what everybody reaches for and
      the league says it is not true: it collides with CFM and with a league that
      once existed here. "The most southern beer league" is the one they stand
      behind, so it is the one that ships. A claim in a meta tag ends up quoted by
      the press, and correcting it afterwards is not possible.
    -->
    <meta
      name="description"
      content="La beer league de hockey sobre hielo más austral del mundo. Fixture, posiciones, goleadores, arqueros y playoffs de la Ushuaia Beer League, en Tierra del Fuego."
    />

    <!--
      The one address that counts, said out loud, because the same site answers at
      more than one host: the league's own domain, a Cloudflare Pages address, a copy
      on Vercel for looking at a change before it is live, and the GitHub Pages
      address it started on. Without this a search engine has four candidates for the
      same page and picks one of them.

      Every host names this one, including the ones that are not it. That is what
      makes it useful rather than decorative: GitHub Pages telling crawlers that the
      real address is `ubl.com.ar` is how the move to the new domain keeps whatever
      the old one had earned.

      It names the domain before the domain resolves, on purpose. The alternative was
      to keep naming an address whose share card already answered 404, and this one
      becomes correct on its own the moment NIC.ar delegates, with nobody editing
      anything.
    -->
    <link rel="canonical" href="https://ubl.com.ar/" />

    <!--
      The card that shows when somebody drops the link into a WhatsApp group,
      which is how this site will actually be shared.

      The image is absolute because a relative one is ignored by every scraper, and
      it is served from `public/` rather than imported like the crest the page
      itself draws: an imported asset gets a hash in its filename at build time,
      and a hash cannot be written into static HTML.

      It is 1200 by 630, the shape a wide card wants, so `summary_large_image` is
      honest here. The crest on its own is portrait, and declaring a portrait
      drawing as a wide card gets it cropped to a shape nobody drew it for; the
      wide version is built around the crest instead, in the site's own typeface,
      by `scripts/build-share-card.py`. It stands in until the league finds a
      horizontal photo of the ice, which is what they would rather have.

      JPEG and not WebP: some clients still refuse a WebP preview, and this is the
      one image whose whole job is to render inside somebody else's app.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ushuaia Beer League" />
    <meta property="og:locale" content="es_AR" />
    <meta
      property="og:title"
      content="Ushuaia Beer League: hockey sobre hielo en el fin del mundo"
    />
    <meta
      property="og:description"
      content="La beer league de hockey sobre hielo más austral del mundo. Fixture, posiciones, goleadores y playoffs."
    />
    <meta property="og:url" content="https://ubl.com.ar/" />
    <meta property="og:image" content="https://ubl.com.ar/ubl-share.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Escudo de la Ushuaia Beer League, un chopp de cerveza con patines de hockey, junto al nombre de la liga."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0a0e14" />

    <!--
      What the league is, in the vocabulary a search engine already understands.
      This is what lets Google treat the site, the Instagram account and the name
      as one thing rather than three unrelated results.

      The street address is missing on purpose: the league gave two venues, Bahía
      and Poli, and one address and one rink name, and which belongs to which has
      not been answered. An address on the wrong rink would send somebody to the
      wrong side of Ushuaia on a Saturday, so the city and the province go in and
      the street waits for the answer.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SportsOrganization",
        "name": "Ushuaia Beer League",
        "alternateName": "UBL",
        "sport": "Hockey sobre hielo",
        "description": "La beer league de hockey sobre hielo más austral del mundo.",
        "url": "https://ubl.com.ar/",
        "logo": "https://ubl.com.ar/ubl-crest.webp",
        "image": "https://ubl.com.ar/ubl-share.jpg",
        "email": "ushuaiabl@gmail.com",
        "sameAs": ["https://www.instagram.com/ushuaiabeerleague/"],
        "areaServed": {
          "@type": "City",
          "name": "Ushuaia"
        },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Ushuaia",
          "addressRegion": "Tierra del Fuego",
          "addressCountry": "AR"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
